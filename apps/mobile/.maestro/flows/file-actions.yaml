appId: org.nimbus.drive
name: file-actions
# New folder, rename, star, trash with Undo, then trash and delete forever. Uses a unique name per run.
---
- runScript:
    file: ../stamp.js
- launchApp
- extendedWaitUntil: { visible: "Search in Nimbus", timeout: 20000 }
- tapOn: "New"
- tapOn: "New folder"
- tapOn: "Folder name"
- inputText: "mae-${output.stamp}"
- pressKey: Enter
- scrollUntilVisible: { element: "Folder, mae-${output.stamp}", timeout: 20000 }
- tapOn: "More actions for mae-${output.stamp}"
- scrollUntilVisible: { element: "Rename" }
- tapOn: "Rename"
- eraseText: 40
- inputText: "mae-${output.stamp}-r"
- pressKey: Enter
- scrollUntilVisible: { element: "Folder, mae-${output.stamp}-r", timeout: 20000 }
- tapOn: "More actions for mae-${output.stamp}-r"
- scrollUntilVisible: { element: "Move to trash" }
- tapOn: "Move to trash"
- tapOn: "Undo"
- scrollUntilVisible: { element: "Folder, mae-${output.stamp}-r", timeout: 20000 }
- tapOn: "More actions for mae-${output.stamp}-r"
- scrollUntilVisible: { element: "Move to trash" }
- tapOn: "Move to trash"
- assertNotVisible: "Folder, mae-${output.stamp}-r"
