name: nimbus

# Every port binds to 127.0.0.1: only nginx on this host (setup-nginx.sh) faces
# the internet. Values come from .env next to this file: run ./setup.sh, or copy
# production_script/.env.example.
#
# COMPOSE_PROFILES in .env picks the optional services:
#   postgres  run Postgres here (otherwise DATABASE_URL points at yours)
#   minio     run MinIO here as file storage (otherwise S3_* point at yours)
#   backup    run the backup worker
#   push      run ntfy, a push server for the Android app (README, "Android app")
#   ml        run nimbus-ml, the optional AI service (speech, photo and face search)

x-nimbus: &nimbus
  image: nimbus-app:latest
  pull_policy: never # built by the migrate service
  restart: unless-stopped
  env_file: .env
  environment: &nimbus-env
    REDIS_URL: redis://redis:6379/0
    CACHE_URL: redis://redis:6379/1
    BETTER_AUTH_URL: https://${DOMAIN}
    TUS_URL: https://${DOMAIN}/files/
    ML_URL: http://ml:8000
    ML_TOKEN: ${ML_TOKEN:-}
  # Reach the public names through this host's nginx, not a hairpin through the
  # router; host.docker.internal is this host, for a Postgres running on it.
  extra_hosts: &hosts
    - ${DOMAIN}:host-gateway
    - ${S3_DOMAIN:-s3.invalid}:host-gateway
    - host.docker.internal:host-gateway

services:
  postgres:
    image: pgvector/pgvector:pg17
    profiles: [postgres]
    restart: unless-stopped
    environment:
      POSTGRES_USER: nimbus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: nimbus
    ports: ["127.0.0.1:54340:5432"] # for the backup worker, which runs on the host network
    volumes: [postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nimbus"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports: ["127.0.0.1:6340:6379"]
    volumes: [redis:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    profiles: [minio]
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
      MINIO_API_CORS_ALLOW_ORIGIN: https://${DOMAIN}
    ports: ["127.0.0.1:3402:9000", "127.0.0.1:3403:9001"] # console: ssh -L 3403:127.0.0.1:3403
    volumes: [minio:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    profiles: [minio]
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      sh -c "mc alias set local http://minio:9000 $${S3_ACCESS_KEY} $${S3_SECRET_KEY} &&
             mc mb --ignore-existing local/$${S3_BUCKET}"
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
    restart: "no"

  tusd:
    image: tusproject/tusd:latest
    restart: unless-stopped
    depends_on:
      minio-init: { condition: service_completed_successfully, required: false }
    command: >
      -host 0.0.0.0 -port 1080 -base-path /files/ -behind-proxy
      -s3-bucket ${S3_BUCKET} -s3-endpoint=${S3_ENDPOINT}
      -hooks-http http://app:3000/api/tus-hooks?secret=${TUS_HOOK_SECRET}
      -hooks-enabled-events pre-create,post-finish,post-terminate
      -cors-allow-origin https://${DOMAIN}
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      AWS_REGION: ${S3_REGION}
    extra_hosts: *hosts
    ports: ["127.0.0.1:3401:1080"]

  migrate:
    <<: *nimbus
    build: { context: ., dockerfile: apps/web/Dockerfile }
    pull_policy: build
    command: ["node", "scripts/migrate.ts"]
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy, required: false }

  app:
    <<: *nimbus
    ports: ["127.0.0.1:3400:3000"]
    volumes: [tessdata:/data/tessdata]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully, required: false }

  # Emails, storage cleanup, search indexing, health checks. Required.
  worker:
    <<: *nimbus
    command: ["node", "scripts/worker.ts"]
    volumes: [tessdata:/data/tessdata]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  # Self-hosted push (profile "push"). Put HTTPS in front of 127.0.0.1:3405 at
  # ntfy.${DOMAIN}; that address goes in the ntfy app on the phone.
  ntfy:
    image: binwiederhier/ntfy:v2.11.0
    profiles: [push]
    restart: unless-stopped
    command: serve
    environment:
      NTFY_BASE_URL: https://ntfy.${DOMAIN}
      NTFY_BEHIND_PROXY: "true"
      NTFY_CACHE_FILE: /var/cache/ntfy/cache.db
    ports: ["127.0.0.1:3405:80"]
    volumes: [ntfy:/var/cache/ntfy]

  # Optional AI service (profile "ml"): speech search, photo search, face grouping.
  # CPU only. Turn the features on in Admin → System → AI; models download from there.
  ml:
    build: ./services/ml
    image: nimbus-ml:latest
    profiles: [ml]
    restart: unless-stopped
    mem_limit: ${NIMBUS_ML_MEMORY:-3g}
    environment:
      ML_TOKEN: ${ML_TOKEN:-}
    volumes: [ml-models:/models]
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8000/health"]
      interval: 30s
      retries: 3

  # WebDAV at /dav (nginx forwards it here). Next can't route WebDAV's methods,
  # so this hands each request to the app as a signed POST.
  webdav:
    <<: *nimbus
    command: ["node", "scripts/webdav.ts"]
    environment:
      <<: *nimbus-env
      WEBDAV_APP_URL: http://app:3000
    ports: ["127.0.0.1:3404:3404"]
    depends_on:
      app: { condition: service_started }

  # Browser SSH terminal (Secrets → SSH): WebSockets from xterm.js to ssh2. nginx forwards
  # /ssh-ws here. Next can't upgrade WebSockets itself.
  ssh-terminal:
    <<: *nimbus
    command: ["node", "scripts/ssh-terminal.ts"]
    environment:
      <<: *nimbus-env
      SSH_TERMINAL_APP_URL: http://app:3000
    ports: ["127.0.0.1:3406:3406"]
    depends_on:
      app: { condition: service_started }

  # Admin → System → Backups (profile "backup"). It drives this host's Docker
  # (pg_dump and a throwaway Postgres to verify each dump), so it gets the Docker
  # socket, root, and the host network.
  backup-worker:
    <<: *nimbus
    profiles: [backup]
    command: ["node", "scripts/backup-worker.ts"]
    user: root
    network_mode: host
    extra_hosts: []
    environment:
      <<: *nimbus-env
      DATABASE_URL: ${HOST_DATABASE_URL}
      REDIS_URL: redis://127.0.0.1:6340/0
      CACHE_URL: redis://127.0.0.1:6340/1
    volumes: ["/var/run/docker.sock:/var/run/docker.sock"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

volumes:
  tessdata:
  postgres:
  minio:
  redis:
  ntfy:
  ml-models:
